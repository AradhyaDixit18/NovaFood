name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, unit and API tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # API tests start an in-memory MongoDB (mongodb-memory-server) on their own.
      - run: npm test
      - run: npm run build

  e2e:
    name: End-to-end (production build)
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 25
    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']
    env:
      NODE_ENV: production
      PORT: 4000
      CLIENT_URL: http://localhost:4000
      MONGODB_URI: mongodb://127.0.0.1:27017/novafood_e2e
      JWT_ACCESS_SECRET: ci-only-secret-ci-only-secret-ci-only-secret-0123456789
      COOKIE_SECURE: 'true'
      WEB_DIST_DIR: ${{ github.workspace }}/apps/web/dist
      SEED_ADMIN_PASSWORD: AdminDemo@123
      SEED_ALLOW_RESET: 'true'
      LOG_LEVEL: warn
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run seed:dist -w @novafood/api -- --reset
      - name: Start the production server (API + website on one origin)
        run: |
          npm start &
          for i in $(seq 60); do curl -sf http://localhost:4000/api/health >/dev/null && exit 0; sleep 1; done
          echo "server did not become healthy" && exit 1
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          E2E_BASE_URL: http://localhost:4000
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
