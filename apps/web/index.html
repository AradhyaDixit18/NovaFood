<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ff4d2e" />
    <title>NovaFood · Bhook lagi? Order in minutes</title>
    <meta name="description" content="NovaFood is a playful, real-time food ordering app: discover restaurants by mood, customise dishes, pay securely and track your order live." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NovaFood" />
    <meta property="og:title" content="NovaFood · Mood = food" />
    <meta property="og:description" content="Discover food by mood, order in a few taps and watch it arrive live." />
    <meta property="og:image" content="/og-image.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('nf-theme');
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.dataset.theme = 'dark';
      } catch (e) {}
    </script>
  </head>
  <body>
    <noscript>NovaFood needs JavaScript to order food. Please enable it and reload.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
